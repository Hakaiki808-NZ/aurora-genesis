name: Genesis neural adapter checks
on:
  push:
    paths:
      - 'genesis/**'
      - 'tests/neural_backend.py'
      - 'tests/neural_adaptation_contract.py'
      - 'tests/neural_adaptation_benchmark.py'
      - 'tests/feedback_loop.py'
      - 'tests/oss_backend.py'
      - 'deploy/oss/**'
      - '.github/workflows/genesis-neural.yml'
      - 'verify.py'
  pull_request:
    paths:
      - 'genesis/**'
      - 'tests/neural_backend.py'
      - 'tests/neural_adaptation_contract.py'
      - 'tests/neural_adaptation_benchmark.py'
      - 'tests/feedback_loop.py'
      - 'tests/oss_backend.py'
      - 'deploy/oss/**'
      - '.github/workflows/genesis-neural.yml'
      - 'verify.py'
permissions:
  contents: read
jobs:
  no-cloud-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GENESIS_GENERATOR: none
      GENESIS_BEDROCK_ENABLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax and compile
        run: python -m compileall -q genesis tests/neural_backend.py tests/neural_adaptation_contract.py tests/neural_adaptation_benchmark.py tests/feedback_loop.py
      - name: Bounded neural backend tests (stubbed, no external calls)
        run: python -m tests.neural_backend
      - name: Neural adaptation, held-out evaluation protocol, and feedback safety contracts
        run: |
          python -m tests.neural_adaptation_contract
          python -m tests.neural_adaptation_benchmark
          python -m tests.feedback_loop
      - name: Self-hosted OSS backend tests (mocked; no downloads)
        run: python -m tests.oss_backend
      - name: Validate private OSS Docker Compose syntax
        run: docker compose -f deploy/oss/compose.yaml config --quiet
      - name: Existing behavior regression
        run: |
          python -m tests.regression
          python -m tests.refinement
          python -m tests.api_test
