name: Aurora signed public contract provenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurora-contract-provenance.yml'
      - 'MODEL_API.md'
      - 'PUBLIC_PRIVATE_BOUNDARY.md'
      - 'VERSIONING.md'
      - 'VERSION'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source snapshot version
        id: source_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[a-z0-9.]+)?$ ]] || { echo 'Invalid VERSION'; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build deterministic public contract archive
        shell: bash
        env:
          PUBLIC_VERSION: ${{ steps.source_version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p dist
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -cf "dist/aurora-public-contracts-v${PUBLIC_VERSION}.tar" \
            MODEL_API.md PUBLIC_PRIVATE_BOUNDARY.md VERSIONING.md
          gzip -n -9 "dist/aurora-public-contracts-v${PUBLIC_VERSION}.tar"
          sha256sum "dist/aurora-public-contracts-v${PUBLIC_VERSION}.tar.gz" | tee dist/SHA256SUMS
      - name: Sign reproducible artifact provenance (Sigstore OIDC)
        uses: actions/attest@v4
        with:
          subject-path: dist/aurora-public-contracts-v${{ steps.source_version.outputs.value }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-public-contracts-and-digest
          path: |
            dist/aurora-public-contracts-v${{ steps.source_version.outputs.value }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
