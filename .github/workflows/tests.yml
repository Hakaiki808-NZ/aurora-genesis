name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Kyro feature-freeze policy
        run: python -m unittest tests.test_kyro_freeze_guard
      - name: Enforce Kyro stabilization-only pull requests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python tools/check_kyro_freeze.py
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python verify.py
      - run: python -m unittest tests.test_aurora_c2_workspace
      - run: node --check web/kyro/v3/app.js
      - run: node --check web/kyro/v3/neural.js
      - run: node tests/kyro-neural-live-static.cjs
      - run: node --check web/kyro/v3/capabilities.js
