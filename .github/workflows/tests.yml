name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r genesis/neurol/requirements.txt
      - run: python verify.py
      - run: python -m unittest tests.test_aurora_c2_workspace
      - run: node --check web/kyro/v3/app.js
      - run: node --check web/kyro/v3/neural.js
      - run: node tests/kyro-neural-live-static.cjs
      - run: node --check web/kyro/v3/capabilities.js
