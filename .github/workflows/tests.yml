name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python verify.py
      - name: Export Genesis public source for local integration
        if: github.event_name == 'push' && github.ref_name == 'fix/intent-capsule-context-2026-11-06'
        uses: actions/upload-artifact@v4
        with:
          name: genesis-public-source
          path: |
            config/
            genesis/
            data/
            tests/
            run.py
            serve.py
            verify.py
            requirements.txt
            README.md
          retention-days: 1
