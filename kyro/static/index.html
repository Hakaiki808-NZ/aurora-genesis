<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Kyro | Genesis local alpha</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="mark" aria-hidden="true">K</div>
      <div>
        <h1>Kyro <span>· Genesis</span></h1>
        <p>Interface + Model <span class="muted">/ Powered by Engine (planned)</span></p>
      </div>
      <span class="phase">LOCAL ALPHA</span>
    </header>
    <section class="access" aria-label="Local authentication">
      <label for="token">Access token from the launch terminal</label>
      <div class="access-row">
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste launch token">
        <button id="unlock" type="button">Unlock</button>
      </div>
      <p class="hint">Token stays in this tab's memory. Do not expose this server to the internet.</p>
      <p id="status" role="status" aria-live="polite">Locked</p>
    </section>
    <section class="conversation" aria-label="Conversation with Genesis">
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions">
        <div class="bubble assistant">Genesis is available when you unlock the local interface.</div>
      </div>
      <form id="chat-form">
        <label for="message">Message</label>
        <textarea id="message" rows="3" maxlength="16000" required placeholder="Ask Genesis…"></textarea>
        <button id="send" type="submit" disabled>Send</button>
      </form>
    </section>
    <footer>Research prototype · No live Aurora execution attached · Not validated AGI</footer>
  </main>
</body>
</html>
